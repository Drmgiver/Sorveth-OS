[package]
name = "sorveth-boot"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "sorveth-boot"
path = "src/main.rs"
test = false
bench = false

[features]
qemu-smoke = ["sorveth-core/qemu-smoke"]
qemu-fault = ["sorveth-core/qemu-fault"]
qemu-user = ["sorveth-core/qemu-user"]
qemu-isolate-a = ["sorveth-core/qemu-isolate-a"]
qemu-isolate-b = ["sorveth-core/qemu-isolate-b"]
qemu-transfer-a = ["sorveth-core/qemu-transfer-a"]
qemu-transfer-b = ["sorveth-core/qemu-transfer-b"]

[dependencies]
sorveth-abi = { path = "../sorveth-abi" }
sorveth-core = { path = "../sorveth-core" }
